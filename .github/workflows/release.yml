name: Release - Automated App Store Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
      platform:
        description: 'Platform to release'
        required: true
        type: choice
        options:
          - both
          - android
          - ios

jobs:
  create-release-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create and push tag
        id: create_tag
        run: |
          TAG_NAME="v${{ github.event.inputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a $TAG_NAME -m "Release $TAG_NAME"
          git push origin $TAG_NAME
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  build-android-release:
    name: Build Android for Play Store
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'
    needs: create-release-tag
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB
        run: eas build --platform android --profile production --non-interactive --no-wait

      - name: Wait for build completion
        run: |
          echo "Build started. Check EAS dashboard for progress."
          echo "Build will be automatically submitted when complete."

  build-ios-release:
    name: Build iOS for App Store
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'
    needs: create-release-tag
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA
        run: eas build --platform ios --profile production --non-interactive --no-wait

      - name: Wait for build completion
        run: |
          echo "Build started. Check EAS dashboard for progress."
          echo "Build will be automatically submitted when complete."

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [create-release-tag, build-android-release, build-ios-release]
    if: always() && needs.create-release-tag.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-release-tag.outputs.tag_name }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            ## Sally Mobile v${{ github.event.inputs.version }}
            
            ### What's New
            ${{ steps.changelog.outputs.changelog }}
            
            ### Downloads
            - **Android**: Check Google Play Store or download from EAS dashboard
            - **iOS**: Check App Store or download from EAS dashboard
            - **Web**: https://techfundoffice.github.io/sally-mobile-web/
            
            ### Installation
            - **Mobile**: Available on Google Play Store and Apple App Store
            - **Web**: Visit the URL above
            
            ---
            Built with ❤️ using React Native and Expo
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
